<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老板查账-身份验证</title>
    <style>
        /* 登录框样式 */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #8b4513; display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: white; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        input { padding: 10px; width: 200px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .admin-content { display: none; } /* 默认隐藏后台内容 */
        /* ... 保留你之前的表格样式 ... */
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div class="login-box">
            <h3>🍵 老板，请对暗号</h3>
            <input type="password" id="passInput" placeholder="请输入管理密码">
            <br>
            <button onclick="checkLogin()" style="background:#8b4513; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">进入后台</button>
        </div>
    </div>

    <div id="adminMain" class="admin-content">
        <div class="container">
            <h2>📋 茶颜悦色·私密订单后台</h2>
            <button class="btn" onclick="loadOrders()">🔄 刷新订单</button>
            <button onclick="logout()" style="float:right;">退出登录</button>
            <table>
                <thead>
                    <tr><th>时间</th><th>客户</th><th>电话</th><th>饮品</th><th>金额</th></tr>
                </thead>
                <tbody id="orderList"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentPass = localStorage.getItem('admin_token') || '';

        // 页面加载检查
        if(currentPass) {
            checkLogin(currentPass);
        }

        async function checkLogin(providedPass) {
            const pass = providedPass || document.getElementById('passInput').value;
            
            try {
                // 尝试带密码去拉取一次数据
                const response = await fetch('https://tea-order-server-qt5g.onrender.com/api/orders', {
                    headers: { 'x-admin-password': pass }
                });

                if (response.ok) {
                    // 密码正确
                    localStorage.setItem('admin_token', pass); // 记住密码
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('adminMain').style.display = 'block';
                    renderData(await response.json());
                } else {
                    alert('暗号不对，再想想？');
                    localStorage.removeItem('admin_token');
                }
            } catch (e) {
                alert('服务器连接失败');
            }
        }

        async function loadOrders() {
            const pass = localStorage.getItem('admin_token');
            const response = await fetch('https://tea-order-server-qt5g.onrender.com/api/orders', {
                headers: { 'x-admin-password': pass }
            });
            renderData(await response.json());
        }

        function renderData(result) {
            const tbody = document.getElementById('orderList');
            tbody.innerHTML = '';
            result.data.reverse().forEach(order => {
                const items = order.order_items ? order.order_items.map(i => i.name).join(', ') : '未知';
                tbody.innerHTML += `<tr><td>${order.create_time}</td><td>${order.user_name}</td><td>${order.user_phone}</td><td>${items}</td><td>￥${order.total_price}</td></tr>`;
            });
        }

        function logout() {
            localStorage.removeItem('admin_token');
            location.reload();
        }
    </script>
</body>
</html>
