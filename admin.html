<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>茶颜悦色-订单管理后台</title>
    <style>
        body { font-family: 'PingFang SC', sans-serif; background: #fdf5e6; padding: 20px; color: #5d4037; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #8b4513; }
        h2 { text-align: center; color: #8b4513; border-bottom: 2px solid #deb887; padding-bottom: 10px; }
        .btn { background: #8b4513; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 20px; display: block; margin-left: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e0d0b0; padding: 12px; text-align: left; }
        th { background: #f4ece0; color: #8b4513; }
        tr:hover { background: #fffaf0; }
        .price { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📋 茶颜悦色·实时订单后台</h2>
        <button class="btn" onclick="loadOrders()">🔄 刷新订单数据</button>
        <table>
            <thead>
                <tr>
                    <th>下单时间</th>
                    <th>客户</th>
                    <th>电话</th>
                    <th>饮品</th>
                    <th>金额</th>
                </tr>
            </thead>
            <tbody id="orderList">
                <tr><td colspan="5" style="text-align:center;">正在拉取云端数据...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadOrders() {
            try {
                // 指向你的真实线上地址
                const response = await fetch('https://tea-order-server-qt5g.onrender.com/api/orders');
                const result = await response.json();
                
                const tbody = document.getElementById('orderList');
                tbody.innerHTML = '';

                // 因为你的接口返回的数据在 result.data 里
                if (result.data && result.data.length > 0) {
                    // 倒序排列，最新的订单在最上面
                    result.data.reverse().forEach(order => {
                        const items = order.order_items.map(i => i.name).join(', ');
                        const row = `
                            <tr>
                                <td>${order.create_time}</td>
                                <td>${order.user_name}</td>
                                <td>${order.user_phone}</td>
                                <td>${items}</td>
                                <td class="price">￥${order.total_price}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">暂无订单记录</td></tr>';
                }
            } catch (error) {
                console.error('加载失败:', error);
                alert('连接服务器失败，请稍后再试');
            }
        }
        // 自动加载
        loadOrders();
    </script>
</body>
</html>
