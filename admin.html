<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>茶颜悦色 · 订单后台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream:        #fdf6ec;
      --latte:        #e8d5b7;
      --caramel:      #c8955a;
      --caramel-dark: #a0703a;
      --tea:          #6b4a2a;
      --tea-light:    #9e7553;
      --white:        #ffffff;
      --red:          #e05252;
      --green:        #4caf7d;
      --shadow:       rgba(100, 60, 20, 0.12);
      --font-title:   'Noto Serif SC', serif;
      --font-body:    'Noto Sans SC', sans-serif;
      --radius:       14px;
      --radius-sm:    8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--tea);
      min-height: 100vh;
    }

    /* ============ 登录遮罩 ============ */
    #loginOverlay {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #6b4a2a 0%, #a0703a 60%, #c8955a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.4s;
    }
    #loginOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .login-box {
      background: var(--white);
      padding: 40px 36px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
      width: 320px;
      animation: popIn 0.4s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .login-icon { font-size: 3rem; margin-bottom: 10px; }
    .login-box h3 {
      font-family: var(--font-title);
      font-size: 1.15rem;
      color: var(--caramel-dark);
      margin-bottom: 24px;
    }
    .login-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--latte);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--tea);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    .login-input:focus { border-color: var(--caramel); }
    .login-input.shake {
      animation: shake 0.4s ease;
      border-color: var(--red);
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--caramel), var(--caramel-dark));
      color: var(--white);
      border: none;
      border-radius: 50px;
      padding: 12px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(200,149,90,0.4);
    }
    .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .login-error {
      font-size: 0.8rem;
      color: var(--red);
      margin-top: 10px;
      display: none;
    }

    /* ============ 后台主内容 ============ */
    #adminMain {
      display: none;
      min-height: 100vh;
    }

    /* 顶部栏 */
    .admin-nav {
      background: linear-gradient(135deg, var(--tea) 0%, var(--caramel-dark) 100%);
      color: var(--white);
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 16px rgba(100,60,20,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-nav-title {
      font-family: var(--font-title);
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-nav-actions { display: flex; gap: 10px; align-items: center; }
    .nav-btn {
      background: rgba(255,255,255,0.15);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      padding: 6px 16px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.28); }
    .nav-btn.danger:hover { background: rgba(224,82,82,0.55); border-color: var(--red); }

    /* 内容区 */
    .admin-body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* 统计卡片 */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: 0 3px 14px var(--shadow);
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-icon { font-size: 2rem; }
    .stat-info { flex: 1; }
    .stat-num {
      font-family: var(--font-title);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--caramel);
      line-height: 1.1;
    }
    .stat-label { font-size: 0.78rem; color: var(--tea-light); margin-top: 2px; }

    /* 过滤/搜索栏 */
    .filter-bar {
      background: var(--white);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px var(--shadow);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-bar input {
      border: 1.5px solid var(--latte);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--tea);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s;
      flex: 1;
      min-width: 160px;
    }
    .filter-bar input:focus { border-color: var(--caramel); }
    .filter-bar select {
      border: 1.5px solid var(--latte);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--tea);
      background: var(--cream);
      outline: none;
      cursor: pointer;
    }
    .refresh-btn {
      background: var(--caramel);
      color: var(--white);
      border: none;
      border-radius: 50px;
      padding: 8px 20px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .refresh-btn:hover { background: var(--caramel-dark); transform: translateY(-1px); }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 表格容器 */
    .table-wrap {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 3px 14px var(--shadow);
      overflow: hidden;
    }
    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    thead {
      background: linear-gradient(135deg, var(--tea), var(--caramel-dark));
      color: var(--white);
    }
    thead th {
      padding: 14px 16px;
      text-align: left;
      font-family: var(--font-title);
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--latte);
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fdf0dc; }
    tbody td {
      padding: 13px 16px;
      color: var(--tea);
      vertical-align: middle;
    }

    /* 配送类型标签 */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-pickup   { background: #e8f5e9; color: #2e7d32; }
    .badge-delivery { background: #fff3e0; color: #e65100; }

    /* 商品列表 */
    .items-list { line-height: 1.7; }
    .item-chip {
      display: inline-block;
      background: var(--cream);
      border: 1px solid var(--latte);
      border-radius: 50px;
      padding: 1px 9px;
      font-size: 0.75rem;
      margin: 1px 2px;
      color: var(--tea-light);
    }

    /* 金额 */
    .price-cell {
      font-family: var(--font-title);
      font-weight: 700;
      color: var(--caramel);
    }

    /* 备注 */
    .remark-cell {
      color: var(--tea-light);
      font-size: 0.82rem;
      font-style: italic;
      max-width: 140px;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--tea-light);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; }

    /* 加载状态 */
    .loading-row td {
      text-align: center;
      padding: 50px;
      color: var(--tea-light);
    }
    .loader {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid var(--latte);
      border-top-color: var(--caramel);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* 表格底部 */
    .table-footer {
      padding: 12px 18px;
      background: var(--cream);
      border-top: 1px solid var(--latte);
      font-size: 0.8rem;
      color: var(--tea-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Toast 提示 */
    .toast-msg {
      position: fixed;
      top: 76px;
      right: 20px;
      background: var(--tea);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 500;
      pointer-events: none;
    }
    .toast-msg.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 640px) {
      .admin-nav { padding: 0 14px; }
      .admin-body { padding: 16px 12px 40px; }
      thead th, tbody td { padding: 10px 10px; }
    }
  </style>
</head>
<body>

<!-- ============ 登录遮罩 ============ -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">🍵</div>
    <h3>老板，请对暗号</h3>
    <input
      class="login-input"
      type="password"
      id="passInput"
      placeholder="请输入管理密码"
      onkeydown="if(event.key==='Enter') checkLogin()"
    />
    <button class="login-btn" onclick="checkLogin()">进入后台</button>
    <div class="login-error" id="loginError">暗号不对，再想想？</div>
  </div>
</div>

<!-- ============ 后台主内容 ============ -->
<div id="adminMain">

  <!-- 顶部导航 -->
  <nav class="admin-nav">
    <div class="admin-nav-title">
      📋 茶颜悦色 · 私密订单后台
    </div>
    <div class="admin-nav-actions">
      <span id="navTime" style="font-size:0.78rem;opacity:0.7;"></span>
      <button class="nav-btn danger" onclick="logout()">退出登录</button>
    </div>
  </nav>

  <div class="admin-body">

    <!-- 统计卡片 -->
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-info">
          <div class="stat-num" id="statTotal">—</div>
          <div class="stat-label">总订单数</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-info">
          <div class="stat-num" id="statRevenue">—</div>
          <div class="stat-label">累计营业额</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🛵</div>
        <div class="stat-info">
          <div class="stat-num" id="statDelivery">—</div>
          <div class="stat-label">外卖订单</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏠</div>
        <div class="stat-info">
          <div class="stat-num" id="statPickup">—</div>
          <div class="stat-label">自提订单</div>
        </div>
      </div>
    </div>

    <!-- 过滤栏 -->
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 搜索客户姓名 / 手机号 / 饮品" oninput="filterOrders()" />
      <select id="filterType" onchange="filterOrders()">
        <option value="">全部类型</option>
        <option value="pickup">到店自提</option>
        <option value="delivery">外卖配送</option>
      </select>
      <button class="refresh-btn" id="refreshBtn" onclick="loadOrders()">
        <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        刷新订单
      </button>
    </div>

    <!-- 订单表格 -->
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>下单时间</th>
              <th>客户姓名</th>
              <th>联系电话</th>
              <th>饮品明细</th>
              <th>配送方式</th>
              <th>配送地址</th>
              <th>备注</th>
              <th>金额</th>
            </tr>
          </thead>
          <tbody id="orderList">
            <tr class="loading-row">
              <td colspan="8"><span class="loader"></span>加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="table-footer">
        <span id="footerInfo">—</span>
        <span id="lastRefresh">—</span>
      </div>
    </div>

  </div>
</div>

<!-- Toast 提示 -->
<div class="toast-msg" id="toastMsg"></div>

<script>
  /* ============================================================
     🔧 后端接口地址（与 index.html 保持一致，按需修改）
  ============================================================ */
  const API_BASE = 'https://tea-order-server-qt5g.onrender.com';

  /* —— 全局订单数据 —— */
  let allOrders = [];

  /* —— 页面加载：检查本地是否记住了密码 —— */
  window.addEventListener('DOMContentLoaded', () => {
    updateNavTime();
    setInterval(updateNavTime, 60000);

    const saved = localStorage.getItem('tea_admin_token');
    if (saved) {
      // 用保存的密码静默验证
      silentLogin(saved);
    }
  });

  function updateNavTime() {
    document.getElementById('navTime').textContent =
      new Date().toLocaleString('zh-CN', { hour12: false });
  }

  /* —— 静默登录（页面刷新时自动验证） —— */
  async function silentLogin(pass) {
    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        headers: { 'x-admin-password': pass }
      });
      if (res.ok) {
        showAdmin(await res.json());
      } else {
        localStorage.removeItem('tea_admin_token');
      }
    } catch (e) { /* 网络失败静默忽略，让用户手动登录 */ }
  }

  /* —— 点击登录 —— */
  async function checkLogin() {
    const pass = document.getElementById('passInput').value.trim();
    if (!pass) return;

    const errEl  = document.getElementById('loginError');
    const inputEl = document.getElementById('passInput');

    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        headers: { 'x-admin-password': pass }
      });

      if (res.ok) {
        errEl.style.display = 'none';
        localStorage.setItem('tea_admin_token', pass);
        // 淡出登录框
        document.getElementById('loginOverlay').classList.add('hidden');
        setTimeout(() => {
          document.getElementById('loginOverlay').style.display = 'none';
        }, 400);
        showAdmin(await res.json());
      } else {
        errEl.style.display = 'block';
        inputEl.classList.add('shake');
        inputEl.value = '';
        setTimeout(() => inputEl.classList.remove('shake'), 500);
        localStorage.removeItem('tea_admin_token');
      }
    } catch (e) {
      errEl.textContent = '服务器连接失败，请稍后重试';
      errEl.style.display = 'block';
    }
  }

  /* —— 展示后台 —— */
  function showAdmin(result) {
    document.getElementById('adminMain').style.display = 'block';
    renderData(result);
  }

  /* —— 刷新订单 —— */
  async function loadOrders() {
    const pass = localStorage.getItem('tea_admin_token');
    if (!pass) return;

    const btn  = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    btn.disabled = true;
    icon.style.animation = 'spin 0.6s linear infinite';

    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        headers: { 'x-admin-password': pass }
      });
      if (res.ok) {
        renderData(await res.json());
        showToast('✅ 订单已刷新');
      } else {
        showToast('❌ 刷新失败，请检查密码');
      }
    } catch (e) {
      showToast('❌ 网络异常，请稍后重试');
    } finally {
      btn.disabled = false;
      icon.style.animation = '';
    }
  }

  /* —— 渲染数据（核心修复点） —— */
  function renderData(result) {
    // result 格式：{ code: 200, data: [...], total: N }
    allOrders = (result.data || []);
    updateStats();
    filterOrders();
    document.getElementById('lastRefresh').textContent =
      '上次刷新：' + new Date().toLocaleTimeString('zh-CN');
  }

  /* —— 更新统计卡片 —— */
  function updateStats() {
    const total    = allOrders.length;
    const revenue  = allOrders.reduce((s, o) => s + (Number(o.total_price) || 0), 0);
    const delivery = allOrders.filter(o => o.delivery_type === 'delivery').length;
    const pickup   = allOrders.filter(o => o.delivery_type === 'pickup').length;

    document.getElementById('statTotal').textContent    = total;
    document.getElementById('statRevenue').textContent  = '¥' + revenue.toFixed(0);
    document.getElementById('statDelivery').textContent = delivery;
    document.getElementById('statPickup').textContent   = pickup;
  }

  /* —— 搜索 + 过滤 —— */
  function filterOrders() {
    const keyword  = document.getElementById('searchInput').value.trim().toLowerCase();
    const typeFilter = document.getElementById('filterType').value;

    let filtered = allOrders.filter(order => {
      // 类型过滤
      if (typeFilter && order.delivery_type !== typeFilter) return false;
      // 关键词搜索
      if (keyword) {
        const items = getItemsText(order).toLowerCase();
        const name  = (order.user_name  || '').toLowerCase();
        const phone = (order.user_phone || '').toLowerCase();
        if (!name.includes(keyword) && !phone.includes(keyword) && !items.includes(keyword)) {
          return false;
        }
      }
      return true;
    });

    renderTable(filtered);
    document.getElementById('footerInfo').textContent =
      `共 ${allOrders.length} 条订单，当前显示 ${filtered.length} 条`;
  }

  /* —— 渲染表格行 —— */
  function renderTable(orders) {
    const tbody = document.getElementById('orderList');

    if (orders.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="8">
            <div class="empty-state">
              <div class="empty-icon">🧋</div>
              <p>暂无订单数据，快去推广吧～</p>
            </div>
          </td>
        </tr>`;
      return;
    }

    tbody.innerHTML = orders.map(order => {
      /* —— 解析商品明细 ——
         server.js 已在查询时 JSON.parse 了 order_items，
         所以这里 order.order_items 是数组；做容错处理以防万一。
      */
      let items = order.order_items;
      if (typeof items === 'string') {
        try { items = JSON.parse(items); } catch(e) { items = []; }
      }
      if (!Array.isArray(items)) items = [];

      const itemsHtml = items.length > 0
        ? items.map(i =>
            `<span class="item-chip">${escHtml(i.name || i.item_name || '?')} ×${i.quantity||i.qty||1}</span>`
          ).join('')
        : '<span style="color:#bbb">—</span>';

      const deliveryBadge = order.delivery_type === 'delivery'
        ? '<span class="badge badge-delivery">🛵 外卖</span>'
        : '<span class="badge badge-pickup">🏠 自提</span>';

      const addr = order.delivery_addr || order.delivery_address || '';

      return `
        <tr>
          <td style="white-space:nowrap;font-size:0.82rem;color:var(--tea-light)">${escHtml(order.create_time||'—')}</td>
          <td><strong>${escHtml(order.user_name||'—')}</strong></td>
          <td style="white-space:nowrap">${escHtml(order.user_phone||'—')}</td>
          <td class="items-list">${itemsHtml}</td>
          <td>${deliveryBadge}</td>
          <td style="font-size:0.82rem;max-width:130px;word-break:break-all">${addr ? escHtml(addr) : '<span style="color:#bbb">—</span>'}</td>
          <td class="remark-cell">${order.remark ? escHtml(order.remark) : '—'}</td>
          <td class="price-cell">¥${Number(order.total_price||0).toFixed(0)}</td>
        </tr>`;
    }).join('');
  }

  /* —— 工具：获取商品文本（用于搜索） —— */
  function getItemsText(order) {
    let items = order.order_items;
    if (typeof items === 'string') {
      try { items = JSON.parse(items); } catch(e) { return ''; }
    }
    if (!Array.isArray(items)) return '';
    return items.map(i => i.name || i.item_name || '').join(' ');
  }

  /* —— 工具：HTML 转义，防 XSS —— */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* —— Toast 提示 —— */
  function showToast(msg) {
    const el = document.getElementById('toastMsg');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  /* —— 退出登录 —— */
  function logout() {
    localStorage.removeItem('tea_admin_token');
    location.reload();
  }
</script>
</body>
</html>
